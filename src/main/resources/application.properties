spring.application.name=az-image-creator

# Defer heavy bean initialization (OkHttp, Netty, Azure SDK) to first use
spring.main.lazy-initialization=true

# Allow large reference image uploads (up to 25 MB per file, 100 MB total request)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Compress text and JSON responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# Expose only the health actuator endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
