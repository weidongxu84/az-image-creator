spring.application.name=az-image-creator

# Defer heavy bean initialization (OkHttp, Netty, Azure SDK) to first use
spring.main.lazy-initialization=true

# Allow large reference image uploads (up to 25 MB per file, 100 MB total request)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Azure OpenAI deployments
# AZURE_OPENAI_DEPLOYMENT defaults to gpt-image-2
# AZURE_OPENAI_CHAT_DEPLOYMENT defaults to gpt-5.4
# AZURE_OPENAI_USE_ALTERNATE_IMAGE_ENDPOINT defaults to false
# When true, AZURE_OPENAI_ALT_IMAGE_ENDPOINT and AZURE_OPENAI_ALT_IMAGE_API_KEY are required
# AZURE_OPENAI_ALT_IMAGE_DEPLOYMENT defaults to gpt-image-2

# Image prompt table in STORAGE_ACCOUNT_NAME
# STORAGE_PROMPT_TABLE_NAME defaults to imageprompts

# Compress text and JSON responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# Expose only the health actuator endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
